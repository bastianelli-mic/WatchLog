[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlog"
version = "0.1.0"
description = "Registro delle visioni di film per un gruppo di amici, con statistiche"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "discord.py>=2.4", "tzdata", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
watchlog = "watchlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
