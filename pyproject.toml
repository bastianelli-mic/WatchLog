[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlog"
version = "0.1.0"
description = "Registro delle visioni di film per un gruppo di amici, con statistiche"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "discord.py>=2.4", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
watchlog = "watchlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
